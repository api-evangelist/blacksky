aid: blacksky

name: BlackSky

description: >-
  BlackSky Technology (NYSE: BKSY) is a Herndon, Virginia headquartered
  real-time space-based intelligence company that operates a high-revisit
  Earth observation constellation and delivers AI-enhanced tactical ISR
  (intelligence, surveillance, and reconnaissance) imagery and analytics to
  defense, intelligence, and global security customers. BlackSky's flagship
  product is the Spectra platform — a cloud-based intelligence hub that
  provides on-demand satellite tasking, sub-90-minute imagery delivery,
  automated AI-driven object detection and change monitoring, archived
  imagery access, and a secure tasking and delivery API. The company
  operates Gen-2 satellites at 83 cm resolution and a newer Gen-3
  constellation delivering 35 cm class very-high-resolution imagery with
  infrared sensors, inter-satellite links, and on-board AI processing,
  manufactured at BlackSky's facility in Tukwila, Washington. Commercial
  offerings include BlackSky ON-DEMAND (flexible global tasking) and
  BlackSky ASSURED (dedicated, contracted persistent monitoring capacity).
  BlackSky's Spectra tasking and imagery API is integrated into partner
  platforms including Esri ArcGIS, UP42, and the STAT (Satellite Tasking
  API) community spec, however the API is access-controlled for vetted
  defense, intelligence, and enterprise customers and is not exposed as a
  public self-service developer portal — there is no public Spectra
  developer documentation site, OpenAPI specification, or open SDKs at the
  time of this entry. The customer revenue model is subscription-based
  Spectra ON-DEMAND and ASSURED contracts, Mission Solutions custom
  engagements, and through marketplace partners.

