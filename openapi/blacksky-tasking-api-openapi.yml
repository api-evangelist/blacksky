openapi: 3.2.0
info:
  title: UP42 Tasking API
  contact:
    name: Contact support
    email: support@up42.com
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License
    url: http://creativecommons.org/licenses/by-nc-nd/4.0/
  version: '1.2'
servers:
- url: https://api.up42.com
security:
- httpBearer: []
tags:
- name: Tasking
paths:
  /v2/coverage/orders/{order-id}:
    get:
      tags:
      - Tasking
      summary: Get coverage of order assets
      description: 'Get coverage information for a tasking order:

        - The total covered geometry, its area, and its percentage relative to the ordered geometry

        - The total remainder geometry, its area, and its percentage relative to the ordered geometry


        This endpoint works with tasking orders that have the following statuses, if any assets have been delivered: `BEING_FULFILLED`, `FULFILLED`, `FAILED_PERMANENTLY`.'
      operationId: getOrderCoverage
      parameters:
      - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliveryMetrics'
        '401':
          $ref: '#/components/responses/CoverageUnauthorized'
      security:
      - httpBearer: []
  /v2/tasking/feasibility-studies:
    get:
      tags:
      - Tasking
      summary: Get feasibility studies for tasking orders
      description: Get a list of feasibility studies for tasking orders.
      operationId: listTaskingFeasibilityStudies
      parameters:
      - name: id
        in: query
        description: 'The feasibility study ID.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: uuid
          example: 68567134-27ad-7bd7-4b65-d61adb11fc78
      - $ref: '#/components/parameters/WorkspaceIdQuery'
      - $ref: '#/components/parameters/OrderIdQuery'
      - name: decision
        in: query
        description: 'The status of feasibility studies.

          '
        required: false
        style: form
        explode: true
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FeasibilityStudyDecision'
      - $ref: '#/components/parameters/PageableSize'
      - $ref: '#/components/parameters/PageablePage'
      - $ref: '#/components/parameters/PageableSorting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeasibilityStudyListResponse'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
      security:
      - httpBearer: []
  /v2/tasking/feasibility-studies/{feasibility-study-id}:
    patch:
      tags:
      - Tasking
      summary: Choose a feasibility study option
      description: 'Accept one of the proposed feasibility study options.


        You can only perform actions with feasibility studies with the `NOT_DECIDED` status.'
      operationId: updateTaskingFeasibilityStudy
      parameters:
      - name: feasibility-study-id
        in: path
        description: The feasibility study ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
          example: 68567134-27ad-7bd7-4b65-d61adb11fc78
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/FeasibilityStudyPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeasibilityStudyPatchResponse'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
  /v2/tasking/orders/feasibility:
    post:
      tags:
      - Tasking
      summary: Check feasibility study requirements
      description: Check whether a feasibility study will be required for a tasking order with specific parameters.
      operationId: checkOrderFeasibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateV2OrderRequest'
        required: true
      responses:
        '207':
          description: 'Feasibility study requirements returned. Any geometry validation failures will be returned inside the `errors` array

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeasibilityRequirementsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
  /v2/tasking/orders/opportunities:
    post:
      tags:
      - Tasking
      summary: Get tasking order opportunities
      description: Get opportunities for a potential tasking order. An opportunity is a time interval when a sensor's pass over your AOI aligns with the specified order parameters.
      operationId: listV2TaskingOrderOpportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateV2OrderRequest'
        required: true
      responses:
        '207':
          description: Opportunities successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaskingOrderOpportunitiesV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /v2/tasking/quotation:
    get:
      tags:
      - Tasking
      summary: Get quotations for tasking orders
      description: Get a list of all quotations for tasking orders.
      operationId: listTaskingQuotation
      parameters:
      - name: id
        in: query
        description: 'The quotation ID.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: uuid
          example: 68567134-27ad-7bd7-4b65-d61adb11fc78
      - $ref: '#/components/parameters/WorkspaceIdQuery'
      - $ref: '#/components/parameters/OrderIdQuery'
      - name: decision
        in: query
        description: 'The status of quotations.

          '
        required: false
        style: form
        explode: true
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskingQuotationDecision'
      - $ref: '#/components/parameters/PageableSize'
      - $ref: '#/components/parameters/PageablePage'
      - $ref: '#/components/parameters/PageableSorting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskingQuotationListResponse'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
      security:
      - httpBearer: []
  /v2/tasking/quotation/{quotation-id}:
    patch:
      tags:
      - Tasking
      summary: Decide on a quotation
      description: 'Accept or reject a quotation for a tasking order.


        This operation is only allowed on quotations with the `NOT_DECIDED` status.'
      operationId: updateTaskingQuotation
      parameters:
      - name: quotation-id
        in: path
        description: The quotation ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
          example: 68567134-27ad-7bd7-4b65-d61adb11fc78
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TaskingQuotationPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskingQuotation'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              examples:
                budgetIdRequired:
                  $ref: '#/components/examples/BudgetIdRequired'
                budgetIsNotActive:
                  $ref: '#/components/examples/BudgetIsNotActive'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              examples:
                orderNotFound:
                  summary: Order not found
                  value:
                    type: https://docs.up42.com/problems/order-not-found
                    status: 404
                    title: Order not found
                    detail: The order with the ID '68567134-27ad-7bd7-4b65-d61adb11fc78' can't be found.
                    instance: /v2/orders/68567134-27ad-7bd7-4b65-d61adb11fc78
                budgetNotFound:
                  $ref: '#/components/examples/BudgetNotFoundOnQuotation'
                accountNotEnterprise:
                  $ref: '#/components/examples/AccountNotEnterpriseOnQuotation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - httpBearer: []
  /v2/tasking/{order-id}/extensions:
    get:
      tags:
      - Tasking
      summary: Get acquisition date extensions
      description: Fetch acquisition date extensions for a tasking order.
      operationId: getOrderAcquisitionDateExtensions
      parameters:
      - $ref: '#/components/parameters/OrderIdPathKebab'
      - $ref: '#/components/parameters/PageableSize'
      - $ref: '#/components/parameters/PageablePage'
      - $ref: '#/components/parameters/PageableSorting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionDateExtensionsListResponse'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
    post:
      tags:
      - Tasking
      summary: Request an acquisition date extension
      description: Request an extension of the acquisition window for a tasking order. The request is created with the `AWAITING` status and will be approved or rejected after the review.
      operationId: createExtensionRequest
      parameters:
      - $ref: '#/components/parameters/OrderIdPathKebab'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquisitionDateExtensionRequest'
        required: true
      responses:
        '200':
          description: The acquisition date extension request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionDateExtensionResponse'
        '400':
          description: Extension request not valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              examples:
                invalid_date:
                  value:
                    type: https://docs.up42.com/problems/not-valid-extension
                    status: 400
                    title: Invalid extension date
                    detail: extendedTo must be at least 3 days after current acquisition end
                    instance: /v2/tasking/68567134-27ad-7bd7-4b65-d61adb11fc78/extensions
                active_exists:
                  value:
                    type: https://docs.up42.com/problems/extension-exists
                    status: 400
                    title: Active extension request exists
                    detail: An acquisition extension request is already active for this order. Please wait for it to be approved or rejected before creating a new request.
                    instance: /v2/tasking/68567134-27ad-7bd7-4b65-d61adb11fc78/extensions
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
components:
  schemas:
    PageableResponse:
      type: object
      properties:
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
          example: false
        totalElements:
          type: integer
          format: int64
          example: 100
        totalPages:
          type: integer
          format: int32
          example: 20
        size:
          type: integer
          format: int32
          example: 10
        number:
          type: integer
          format: int32
          example: 0
        sort:
          $ref: '#/components/schemas/Sort'
        numberOfElements:
          type: integer
          format: int32
          example: 10
        first:
          type: boolean
          example: true
        empty:
          type: boolean
          example: false
    PageableObject:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
          example: 0
        pageSize:
          type: integer
          format: int32
          example: 10
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
    AreaCoverageMetrics:
      required:
      - covered
      - remainder
      type: object
      properties:
        covered:
          description: 'Information about the ordered geometry covered by assets.

            '
          allOf:
          - $ref: '#/components/schemas/GeometryMetrics'
        remainder:
          description: 'Information about the ordered geometry not yet covered by assets.

            '
          allOf:
          - $ref: '#/components/schemas/GeometryMetrics'
    TaskingQuotationListResponse:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskingQuotation'
      description: A list of quotations.
      allOf:
      - $ref: '#/components/schemas/PageableResponse'
    ErrorResponseV1:
      required:
      - error
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
        error:
          $ref: '#/components/schemas/ErrorResponseObject'
      description: Legacy error wrapper used for authentication failures and some data-adapter schema errors.
    FeasibilityDifficulty:
      type:
      - string
      - 'null'
      description: 'The acquisition difficulty determined by order parameters.

        '
      example: LOW
      enum:
      - LOW
      - HIGH
      - null
    CoverageFeature:
      required:
      - geometry
      - type
      type: object
      properties:
        type:
          type: string
          description: 'The type of geometry. The only allowed value is `Feature`.

            '
          enum:
          - Feature
        geometry:
          $ref: '#/components/schemas/CoverageGeometry'
        properties:
          type: object
          description: 'Properties of the geometry.

            '
      description: 'A spatially bounded GeoJSON feature.

        '
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.2
    FeasibilityRequirementsResponse:
      required:
      - errors
      - results
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/FeasibilityRequirementsResult'
        errors:
          type: array
          description: 'Errors associated with individual geometries, including validation failures due to AOI size or vertex-count limits.

            '
          example: []
          items:
            $ref: '#/components/schemas/BatchEndpointErrorDetail'
      description: 'The feasibility requirements for the specified order parameters.

        '
    FeasibilityStudyPreSave:
      required:
      - accountId
      - orderId
      - type
      - workspaceId
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        workspaceId:
          $ref: '#/components/schemas/WorkspaceId'
        orderId:
          $ref: '#/components/schemas/OrderId'
        type:
          type: string
          description: The feasibility study type.
          enum:
          - AUTO
          - MANUAL
        difficulty:
          $ref: '#/components/schemas/FeasibilityDifficulty'
      description: feasibility study DTO before creation
    FeasibilityStudyWithoutOption:
      required:
      - createdAt
      - createdBy
      - decision
      - id
      - updatedAt
      - updatedBy
      type: object
      properties:
        id:
          type: string
          description: The feasibility study ID.
          format: uuid
        createdAt:
          type: string
          description: The time the feasibility study was created.
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Auditor'
        updatedAt:
          type: string
          description: The last time the feasibility study was changed.
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Auditor'
        decision:
          $ref: '#/components/schemas/FeasibilityStudyDecision'
        decisionById:
          type:
          - string
          - 'null'
          description: The ID of the user that made a decision on this feasibility study.
          format: uuid
        decisionByType:
          type:
          - string
          - 'null'
          description: The type of user that made a decision on this feasibility study.
          enum:
          - USER
          - ADMIN
          - API
          - SYSTEM
          - null
        decisionAt:
          type:
          - string
          - 'null'
          description: The time the decision was made on this feasibility study.
          format: date-time
        comment:
          type:
          - string
          - 'null'
          description: 'Additional information related to the feasibility study. When the feasibility type is `AUTO`, a comment might be provided to give context regarding the assessment.

            '
          example: 'Only one tasking opportunity available. Might require schedule adjustment.

            '
        difficulty:
          $ref: '#/components/schemas/FeasibilityDifficulty'
      description: feasibility study DTO
      allOf:
      - $ref: '#/components/schemas/FeasibilityStudyPreSave'
    TaskingQuotationDecision:
      type: string
      description: The decision for this quotation.
      default: NOT_DECIDED
      enum:
      - NOT_DECIDED
      - ACCEPTED
      - REJECTED
    OrderingFeature:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'The type of geometry. The only allowed value is `Feature`.

            '
          enum:
          - Feature
        geometry:
          $ref: '#/components/schemas/OrderingGeometry'
        properties:
          type: object
      description: 'A spatially bounded GeoJSON feature.

        '
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.2
    AccountId:
      type: string
      description: The account ID.
      format: uuid
      example: 55434287-31bc-3ad7-1a63-d61aac11ac55
    OrderingProblem:
      required:
      - status
      - title
      - type
      type: object
      properties:
        type:
          type: string
          description: 'A URI reference that uniquely identifies the problem type.

            '
          format: uri-reference
        status:
          type: integer
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
        title:
          type: string
          description: 'A short summary of the problem type.

            '
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem.

            '
        instance:
          type:
          - string
          - 'null'
          description: 'A URI reference that identifies the specific occurrence of the problem.

            '
          format: uri-reference
        errors:
          type:
          - array
          - 'null'
          description: Validation errors for specific parameters.
          items:
            $ref: '#/components/schemas/InvalidParam'
      description: RFC 9457 Problem Details for HTTP APIs
    AcquisitionDateExtensionResponse:
      required:
      - createdAt
      - extendedFrom
      - extendedTo
      - id
      - orderId
      - status
      type: object
      properties:
        id:
          type: string
          description: The acquisition date extension ID.
          format: uuid
          example: a0d443a2-41e8-4995-8b54-a5cc4c448227
        orderId:
          $ref: '#/components/schemas/OrderId'
        extendedFrom:
          type: string
          description: The old acquisition end date before the extension.
          format: date-time
          example: '2025-05-30T00:00:00Z'
        extendedTo:
          type: string
          description: The new acquisition end date resulting from this extension.
          format: date-time
          example: '2025-08-30T00:00:00Z'
        createdAt:
          type: string
          description: The timestamp when the extension was created.
          format: date-time
          example: '2025-05-22T00:00:00Z'
        status:
          type: string
          description: The [status](https://docs.up42.com/developers/api-tasking#extension-statuses) of the acquisition date extension request.
          example: AWAITING
          enum:
          - AWAITING
          - APPROVED
          - REJECTED
        reason:
          type:
          - string
          - 'null'
          description: Supporting context for why the acquisition end date is being extended.
          example: Unforeseen weather conditions affecting the original acquisition schedule.
    WorkspaceId:
      type: string
      description: The workspace ID.
      format: uuid
    Sort:
      type: object
      properties:
        empty:
          type: boolean
          example: false
        sorted:
          type: boolean
          example: true
        unsorted:
          type: boolean
          example: false
    ListTaskingOrderOpportunitiesV2Response:
      required:
      - errors
      - results
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: number
                description: 'The geometry index number. Indexing starts from zero.

                  '
                format: int32
                example: 0
              opportunities:
                type: object
                properties:
                  features:
                    type: array
                    description: 'GeoJSON features.

                      '
                    items:
                      $ref: '#/components/schemas/OpportunitiesV2ResponseFeature'
                  status:
                    type: string
                    description: The status of the tasking opportunities search.
                    example: Done
                  type:
                    type: string
                    description: 'The type of GeoJSON object. The only allowed value is `FeatureCollection`.

                      '
                    enum:
                    - FeatureCollection
            description: 'Results for each of the specified geometries.

              '
        errors:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/BatchEndpointErrorDetail'
      description: 'The cost estimation.

        '
    FeasibilityStudyDecision:
      type: string
      description: The decision for this feasibility study.
      default: NOT_DECIDED
      enum:
      - NOT_DECIDED
      - ACCEPTED
    CreateV2OrderRequest:
      required:
      - dataProduct
      - displayName
      - featureCollection
      - params
      type: object
      properties:
        dataProduct:
          type: string
          description: The data product ID.
          format: uuid
          example: 07c33a51-94b9-4509-84df-e9c13ea92b84
        displayName:
          $ref: '#/components/schemas/OrderDisplayName'
        tags:
          $ref: '#/components/schemas/Tags'
        budgetId:
          type:
          - string
          - 'null'
          description: 'The ID of the budget selected for this order. Credit consumption is recorded when the order reaches a [consumption event](https://docs.up42.com/developers/api-budgets#consumption-events) associated with a specific status.

            '
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        params:
          type: object
          additionalProperties: true
          description: 'Order parameters, excluding spatial geometry handled in the `featureCollection` object.

            '
          example:
            spectralBands: bundle
            radiometricProcessing: reflectance
            geometricProcessing: orthorectified
            pixelCoding: 16bit
            priority: high
            maxIncidenceAngle: 20
            maxCloudCover: 20
            projection: '4326'
            acquisitionMode: mono
            acquisitionStart: '2025-11-20T00:00:00.000Z'
            acquisitionEnd: '2025-11-27T00:00:00.000Z'
        featureCollection:
          $ref: '#/components/schemas/OrderingFeatureCollection'
    FeasibilityStudyPatchRequest:
      type: object
      properties:
        acceptedOptionId:
          type: string
          description: The ID of the option to accept.
          format: uuid
      description: Feasibility Study Update Request
    Tags:
      maxItems: 30
      type: array
      description: 'A list of tags that categorize the order. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`).

        '
      items:
        $ref: '#/components/schemas/Tag'
    OrderingGeometry:
      required:
      - coordinates
      - type
      type: object
      properties:
        type:
          type: string
          description: The type of geometry.
          example: Polygon
          enum:
          - Polygon
          - Point
        coordinates:
          description: The coordinates.
          example:
          - - - 77.259584
              - 28.622331
            - - 77.287879
              - 28.622632
            - - 77.287621
              - 28.594794
            - - 77.259389
              - 28.594983
            - - 77.259584
              - 28.622331
          oneOf:
          - type: array
            items:
              type: array
              items:
                minItems: 2
                type: array
                items:
                  type: number
                  format: double
          - type: array
            items:
              type: number
              format: double
        crs:
          type: object
          properties:
            type:
              type: string
              description: The parameter defining the CRS.
              example: name
            properties:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the CRS.
                  example: EPSG:4326
          description: The CRS of the order.
      description: 'The geometry in the GeoJSON format.

        '
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
    TaskingQuotation:
      required:
      - createdAt
      - createdBy
      - decision
      - decisionAt
      - decisionById
      - decisionByType
      - id
      - updatedAt
      - updatedBy
      type: object
      properties:
        id:
          type: string
