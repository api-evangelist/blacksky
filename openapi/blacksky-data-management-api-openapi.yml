              - property: gsd
              - 0.7
            - op: <=
              args:
              - property: eo:cloud_cover
              - 20
        filter-lang:
          title: Filter language
          type: string
          description: The CQL filter that encodes the value used in `filter`. The only supported value is `cql2-json`.
          default: cql2-json
          enum:
          - cql2-json
        bbox:
          title: Intersecting bbox
          maxItems: 4
          minItems: 4
          type: array
