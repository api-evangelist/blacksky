      properties:
        collections:
          title: Collections
          type: array
          description: Search for STAC items in the specified STAC collections.
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          items:
            type: string
            format: uuid4
        ids:
          title: IDs
          type: array
          description: Search for specific STAC items by their IDs.
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          items:
            type: string
            format: uuid4
        datetime:
          title: Datetime
          type: string
          description: 'Search for data that has a temporal property that intersects the datetime value in the RFC 3339 format. You can search for a specific date and time, or for a closed or an open date interval. Express open intervals using double-dots.

            - An example of a timestamp: `"2025-02-12T23:20:50Z"`.

            - An example of a closed interval: `"2025-02-12T00:00:00Z/2018-03-18T12:31:12Z"`.

            - Examples of open intervals: `"2025-02-12T00:00:00Z/.."` or `"../2025-03-18T12:31:12Z"`.''

            '
          example: '2025-02-12T23:20:50Z'
        sortby:
          title: Response sorting
          type: array
