          example:
          - field: datetime
            direction: desc
          items:
            $ref: '#/components/schemas/ItemSortClause'
        limit:
          title: Response record limit
          maximum: 10000
          minimum: 1
          type: integer
          description: 'The maximum number of data items on a results page.

            '
          example: 10
          default: 10
        page:
          title: page
          type: integer
          description: The number of the page to return. To get the first page, set the parameter to `0`.
          example: 0
        filter:
          title: CQL2-json filter
          type: object
          description: 'A [CQL2 filter](https://docs.up42.com/developers/api-stac#detailed-search) that consists of arguments (`filter.args`) and operators (`filter.op`).

            '
          example:
            op: and
            args:
            - op: <=
