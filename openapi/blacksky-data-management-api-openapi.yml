openapi: 3.2.0
info:
  title: UP42 Data management API
  contact:
    name: Contact support
    email: support@up42.com
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License
    url: http://creativecommons.org/licenses/by-nc-nd/4.0/
  version: '1.2'
servers:
- url: https://api.up42.com
security:
- httpBearer: []
tags:
- name: Data management
paths:
  /v2/assets/stac:
    get:
      tags:
      - Data management
      summary: Get the data management landing page
      description: Get the data management's landing page in the STAC format.
      operationId: getSASLandingPage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/collections:
    get:
      tags:
      - Data management
      summary: Get STAC collections
      description: Get a list of STAC collections in your storage.
      operationId: getSASCollections
      parameters:
      - name: limit
        in: query
        description: The number of results per page.
        required: false
        style: form
        explode: true
        schema:
          title: Limit
          type: integer
          description: The number of results per page.
          default: 10
        example: '3'
      - name: page
        in: query
        description: The page number. To get the first page, set the parameter to `0`.
        required: false
        style: form
        explode: true
        schema:
          title: Page
          type: integer
          description: The page number. To get the first page, set the parameter to `0`.
        example: '0'
      - name: bbox
        in: query
        description: Search for STAC collections that are fully contained within a bounding box in the `[min longitude,min latitude,max longitude,max latitude]` format.
        required: false
        style: form
        explode: true
        schema:
          title: Bbox
          type: string
          description: Search for STAC collections that are fully contained within a bounding box in the `[min longitude,min latitude,max longitude,max latitude]` format.
        example: 160.6,-55.95,170,-25.89
      - name: workspace_id
        in: query
        description: The workspace ID. Use to get STAC collections from a specific workspace. Otherwise, STAC collections from the entire account will be returned.
        required: false
        style: form
        explode: true
        schema:
          title: Workspace Id
          type: string
          description: The workspace ID. Use to get STAC collections from a specific workspace. Otherwise, STAC collections from the entire account will be returned.
        example: a19e9ab6-afad-461f-8043-ce19cfd0985b
      - name: asset_ids
        in: query
        description: Asset IDs. Use to search for STAC collections from any of the provided assets. The input must be a comma-separated list.
        required: false
        style: form
        explode: true
        schema:
          title: Asset Ids
          type: string
          description: Asset IDs. Use to search for STAC collections from any of the provided assets. The input must be a comma-separated list.
        example: bab28a1c-6979-436d-b747-8dd5510fdf77, 9c7811c4-96fd-4b11-b31f-2d2cb1a35189
      - name: order_ids
        in: query
        description: Order IDs. Use to search for STAC collections from any of the provided orders. The input must be a comma-separated list.
        required: false
        style: form
        explode: true
        schema:
          title: Order Ids
          type: string
          description: Order IDs. Use to search for STAC collections from any of the provided orders. The input must be a comma-separated list.
        example: 076ae2d6-bad0-4d35-9028-8e83b28c6a75,9a5e7b13-4ca2-432a-98be-b76fd8947a40
      - name: product_ids
        in: query
        description: Data product IDs. Use to search for STAC collections from any of the provided data products. The input must be a comma-separated list.
        required: false
        style: form
        explode: true
        schema:
          title: Product Ids
          type: string
          description: Data product IDs. Use to search for STAC collections from any of the provided data products. The input must be a comma-separated list.
        example: fadfb6a6-6803-4db9-852e-c59f74cf8db6,1bc252ce-b084-423c-86d0-f31b9d21bb7c
      - name: tags
        in: query
        description: Tags. Use to search for STAC collections with any of the provided tags. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`). The input must be a comma-separated list.
        required: false
        style: form
        explode: true
        schema:
          title: Tags
          type: string
          description: Tags. Use to search for STAC collections with any of the provided tags. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`). The input must be a comma-separated list.
        example: optical,US
      - name: title
        in: query
        description: The STAC collection title.
        required: false
        style: form
        explode: true
        schema:
          title: Title
          type: string
          description: The STAC collection title.
        example: 4c3fc67e_DS_PHR1A_202410081629153_FR1_PX_W084N35_1102_01333
      - name: sources
        in: query
        description: Sources. Use to search for STAC collections from any of the provided sources. The input must be a comma-separated list.
        required: false
        style: form
        explode: true
        schema:
          title: Sources
          type: string
          description: Sources. Use to search for STAC collections from any of the provided sources. The input must be a comma-separated list.
        example: ARCHIVE,TASKING,PROCESSING
      - name: cnam
        in: query
        description: 'Whether to search for STAC collections that are or aren''t [CNAM-transformed](https://docs.up42.com/data-management/cnam).

          - `true`: Search for transformed STAC collections.

          - `false`: Search for not transformed STAC collections (non-CNAM deliveries).

          '
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
        example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collections'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/collections/{collection-id}:
    get:
      tags:
      - Data management
      summary: Get a STAC collection
      description: Get information about a specific STAC collection.
      operationId: getSASCollection
      parameters:
      - $ref: '#/components/parameters/STACCollectionID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STACCollection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
    delete:
      tags:
      - Data management
      summary: Delete a STAC collection
      description: Delete an existing STAC collection.
      operationId: deleteSASCollection
      parameters:
      - $ref: '#/components/parameters/STACCollectionID'
      responses:
        '204':
          description: Successfully deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/collections/{collection-id}/items:
    get:
      tags:
      - Data management
      summary: Get STAC items
      description: Get a list of STAC items from a specific STAC collection in your storage.
      operationId: getSASItems
      parameters:
      - $ref: '#/components/parameters/STACCollectionID'
      - name: limit
        in: query
        description: The number of results per page.
        required: false
        style: form
        explode: true
        schema:
          title: Limit
          type: integer
          description: The number of results per page.
          default: 10
        example: '3'
      - name: page
        in: query
        description: The page number. To get the first page, set the parameter to `0`.
        required: false
        style: form
        explode: true
        schema:
          title: Page
          type: integer
          description: The page number. To get the first page, set the parameter to `0`.
        example: '0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCollection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/collections/{collection-id}/items/{item-id}:
    get:
      tags:
      - Data management
      summary: Get a STAC item
      description: Get information about a specific STAC item.
      operationId: getSASItem
      parameters:
      - $ref: '#/components/parameters/STACCollectionID'
      - name: item-id
        in: path
        description: The STAC item ID.
        required: true
        style: simple
        explode: false
        schema:
          title: Item Id
          type: string
          description: The STAC item ID.
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
    patch:
      tags:
      - Data management
      summary: Update a STAC item
      description: Change the title and tags of a STAC item.
      operationId: patchSASItem
      parameters:
      - $ref: '#/components/parameters/STACCollectionID'
      - name: item-id
        in: path
        description: The STAC item ID.
        required: true
        style: simple
        explode: false
        schema:
          title: Item Id
          type: string
          description: The STAC item ID.
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchItem'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/queryables:
    get:
      tags:
      - Data management
      summary: Get data management search parameters
      description: Get queryable fields supported in data management searches.
      operationId: getSASQueryables
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryablesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/stac/search:
    post:
      tags:
      - Data management
      summary: Get specific STAC items
      description: Make a detailed search request to find specific STAC items in your storage.
      operationId: postSASSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPayload'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCollection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401Response'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP404Response'
        '422':
          description: Request error. Check the `detail` property for a specific error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP422Response'
        '500':
          description: Server error. Please contact support
      security:
      - httpBearer: []
  /v2/assets/{asset-id}/download-url:
    post:
      tags:
      - Data management
      summary: Create a download URL
      description: Generate a signed URL that can be used to download an asset without authentication. The generated URL is valid for 5 minutes.
      operationId: generateDownloadUrlExternal
      parameters:
      - $ref: '#/components/parameters/AssetId'
      responses:
        '201':
          description: URL created successfully
          headers:
            Location:
              description: A temporary signed URL that can be used to download the asset without authentication.
              style: simple
              explode: false
              schema:
                $ref: '#/components/schemas/SignedDownloadURL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
components:
  schemas:
    NullableArray:
      type:
      - array
      - 'null'
    MultiPoint:
      title: MultiPoint
      required:
      - coordinates
      type: object
      properties:
        type:
          title: Type
          type: string
          default: MultiPoint
        coordinates:
          title: Coordinates
          minItems: 1
          type: array
          items:
            anyOf:
            - maxItems: 2
              minItems: 2
              type: array
              items:
                type: number
            - maxItems: 3
              minItems: 3
              type: array
              items:
                type: number
      description: MultiPoint Model
    HTTP422Response:
      title: HTTP422Response
      required:
      - detail
      - status
      - title
      type: object
      properties:
        status:
          title: Unprocessable Content Status
          type: integer
          example: 422
        title:
          title: 422 Error Title
          type: string
          example: Unprocessable Content
        detail:
          title: Detail
          type: array
          example:
          - loc:
            - body
            - links
            msg: field required
            type: value_error.missing
          items:
            $ref: '#/components/schemas/PydanticErrorDict'
    STACPolygon:
      title: Polygon
      required:
      - coordinates
      type: object
      properties:
        type:
          title: Type
          type: string
          default: Polygon
        coordinates:
          title: Coordinates
          minItems: 1
          type: array
          items:
            minItems: 4
            type: array
            items:
              anyOf:
              - maxItems: 2
                minItems: 2
                type: array
                items:
                  type: number
              - maxItems: 3
                minItems: 3
                type: array
                items:
                  type: number
      description: Polygon Model
    QueryablesResponse:
      title: QueryablesResponse
      required:
      - $id
      - properties
      type: object
      properties:
        $schema:
          title: Endpoint schema
          type: string
          description: The schema of the response.
          example: https://json-schema.org/draft/2019-09/schema
          default: https://json-schema.org/draft/2019-09/schema
        $id:
          title: Endpoint ID
          type: string
          description: The URL of the endpoint.
          example: https://api.up42.com/v2/assets/stac/queryables
        type:
          title: Endpoint type
          type: string
          description: The type of resource.
          example: object
          default: object
        title:
          title: Endpoint title
          type: string
          description: The title of the endpoint.
          example: STAC Storage Queryables
          default: STAC Storage Queryables
        description:
          title: Endpoint description
          type: string
          description: The description of the endpoint.
          example: Queryable fields for data management search.
          default: Queryable fields for data management search.
        properties:
          title: Properties
          type: object
          additionalProperties:
            $ref: '#/components/schemas/QueryableResponse'
          description: Queryable fields for catalog search.
          example:
            datetime:
              title: datetime
              description: The date and time when the sensor acquired the data.
              type: timestamp
            account_id:
              title: account_id
              description: The account ID.
              type: string
            up42-system:account_id:
              title: up42-system:account_id
              description: The account ID.
              type: string
            workspace_id:
              title: workspace_id
              description: The workspace ID.
              type: string
            up42-system:workspace_id:
              title: up42-system:workspace_id
              description: The workspace ID.
              type: string
            asset_id:
              title: asset_id
              description: The asset ID.
              type: string
            up42-system:asset_id:
              title: up42-system:asset_id
              description: The asset ID.
              type: string
            tags:
              title: tags
              description: STAC item tags.
              type: array
            up42-user:tags:
              title: up42-user:tags
              description: STAC item tags.
              type: array
            eo:cloud_cover:
              title: eo:cloud_cover
              description: The percentage of cloud coverage.
              type: float
            constellation:
              title: constellation
              description: The platform constellation that acquired the data.
              type: string
            gsd:
              title: gsd
              description: The ground sampling distance.
              type: float
            collection_name:
              title: collection_name
              description: The collection name.
              type: string
            up42-product:collection_name:
              title: up42-product:collection_name
              description: The collection name.
              type: string
            order_id:
              title: order_id
              description: The order ID.
              type: string
            up42-order:id:
              title: up42-order:id
              description: The order ID.
              type: string
            source:
              title: source
              description: The source of the STAC item.
              type: string
            up42-system:source:
              title: up42-system:source
              description: The source of the STAC item.
              type: string
            data_product_id:
              title: data_product_id
              description: The data product ID.
              type: string
            up42-product:product_id:
              title: up42-product:product_id
              description: The data product ID.
              type: string
            created:
              title: created
              description: The date and time when the STAC item was added to your storage.
              type: timestamp
            title:
              title: title
              description: The filename of the STAC item.
              type: string
            user_title:
              title: user_title
              description: A custom title of the STAC item.
              type: string
            up42-user:title:
              title: up42-user:title
              description: A custom title of the STAC item.
              type: string
            job_id:
              title: job_id
              description: The processing job ID.
              type: string
            up42-system:job_id:
              title: up42-system:job_id
              description: The processing job ID.
              type: string
    ItemCollection:
      title: ItemCollection
      required:
      - context
      - features
      - links
      type: object
      properties:
        links:
          title: Links
          type: array
          description: 'Links related to the current endpoint. Use to navigate through objects.

            '
          items:
            $ref: '#/components/schemas/Link'
        type:
          title: Type
          type: string
          description: 'The type of object.

            '
          default: FeatureCollection
          enum:
          - FeatureCollection
        features:
          title: Features
          type: array
          description: 'Data items returned by search.

            '
          items:
            $ref: '#/components/schemas/Item'
        context:
          title: Context
          description: 'The context of the response.

            '
          allOf:
          - $ref: '#/components/schemas/Context'
    PatchItem:
      type: object
      properties:
        up42-user:title:
          maxLength: 250
          minLength: 1
          type:
          - string
          - 'null'
          description: An updated STAC item title.
          example: SPOT 6/7 NY Central Park
        up42-user:tags:
          type: array
          description: A list of tags that categorize the STAC item. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`).
          example:
          - optical
          - US
          items:
            maxLength: 180
            minLength: 1
            type: string
    UnauthorizedErrorResponse:
      type: object
      example:
        data: null
        error:
          code: 401
          message: Full authentication is required to access this resource
          details: null
    NullableObject:
      type:
      - object
      - 'null'
    MultiPolygon:
      title: MultiPolygon
      required:
      - coordinates
      type: object
      properties:
        type:
          title: Type
          type: string
          default: MultiPolygon
        coordinates:
          title: Coordinates
          minItems: 1
          type: array
          items:
            minItems: 1
            type: array
            items:
              minItems: 4
              type: array
              items:
                anyOf:
                - maxItems: 2
                  minItems: 2
                  type: array
                  items:
                    type: number
                - maxItems: 3
                  minItems: 3
                  type: array
                  items:
                    type: number
      description: MultiPolygon Model
    SignedDownloadURL:
      type: string
      description: A temporary signed URL that can be used to download an asset without authentication.
      format: uri
    SpatialExtent:
      title: SpatialExtent
      required:
      - bbox
      type: object
      properties:
        bbox:
          title: Bounding box
          type: array
          description: The bounding box that encloses all STAC items of the STAC collection.
          example:
          - - 160.6
            - -55.95
            - 170
            - -25.89
          items:
            anyOf:
            - maxItems: 4
              minItems: 4
              type: array
              items:
                type: number
            - maxItems: 6
              minItems: 6
              type: array
              items:
                type: number
    LandingPage:
      title: LandingPage
      required:
      - conformsTo
      - description
      - id
      - links
      - stac_extensions
      - stac_version
      type: object
      properties:
        conformsTo:
          title: STAC API standards
          type: array
          description: 'Links to the standards that the resource conforms to.

            '
          example:
          - http://www.opengis.net/spec/ogcapi-features-4/1.0/conf/simpletx
          - https://api.stacspec.org/v1.0.0-rc.1/item-search#fields
          - https://api.stacspec.org/v1.0.0-rc.1/item-search#filter:basic-cql
          - https://api.stacspec.org/v1.0.0-rc.1/collections
          - http://www.opengis.net/spec/ogcapi-features-1/1.0/conf/oas30
          - https://api.stacspec.org/v1.0.0-rc.1/core
