openapi: 3.2.0
info:
  title: UP42 Orders API
  contact:
    name: Contact support
    email: support@up42.com
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License
    url: http://creativecommons.org/licenses/by-nc-nd/4.0/
  version: '1.2'
servers:
- url: https://api.up42.com
security:
- httpBearer: []
tags:
- name: Orders
paths:
  /orders/schema/{data-product-id}:
    get:
      tags:
      - Orders
      summary: Get a JSON schema of an order form
      description: Get detailed information about the parameters needed to create an order for a specific data product.
      operationId: getJSONSchema
      parameters:
      - name: data-product-id
        in: path
        description: The data product ID.
        required: true
        style: simple
        explode: false
        schema:
          title: Data Product Id
          type: string
          description: The data product ID.
          format: uuid
        example: 68567134-27ad-7bd7-4b65-d61adb11fc78
      responses:
        '200':
          description: OK
          content:
            application/schema+json:
              schema:
                type: string
              examples:
                Tasking:
                  value:
                    $schema: https://json-schema.org/draft-07/schema
                    type: object
                    properties:
                      geometry:
                        description: Polygon Model.
                        properties:
                          type:
                            const: Polygon
                            default: Polygon
                            title: Type
                            type: string
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            type: array
                        required:
                        - coordinates
                        title: Geometry
                        type: object
                      displayName:
                        title: Order name
                        type: string
                      extraDescription:
                        title: Description
                        type: string
                      acquisitionStart:
                        format: date-time
                        title: Start
                        type: string
                      acquisitionEnd:
                        format: date-time
                        title: End
                        type: string
                      acquisitionMode:
                        anyOf:
                        - const: spot
                          title: Spot (standard)
                        - const: spot_enhanced
                          title: Spot (enhanced)
                        - const: spot_ultra
                          title: Spot (ultra)
                        - const: strip
                          title: Strip (standard)
                        - const: strip_enhanced
                          title: Strip (enhanced)
                        - const: scan
                          title: Scan (standard)
                        - const: scan_enhanced
                          title: Scan (enhanced)
                        title: Acquisition mode
                        default: spot
                        description: The operation mode that determines azimuth resolution and swath width.
                        type: string
                      maxIncidenceAngle:
                        default: 25
                        description: The maximum allowed angle between the ground normal and look direction from the satellite.
                        maximum: 90
                        minimum: 0
                        title: Maximum incidence angle (°)
                        type: integer
                      polarization:
                        anyOf:
                        - const: hh
                          title: HH
                        - const: vv
                          title: VV
                        - const: vh
                          title: VH
                        - const: hv
                          title: HV
                        title: Polarization
                        default: vv
                        description: 'The direction of travel of an electromagnetic wave: vertical (V) or horizontal (H). The first letter corresponds to how signals are emitted, and the second letter corresponds to how they are received.'
                        type: string
                      looks:
                        anyOf:
                        - const: '1'
                          title: '1'
                        title: Number of looks
                        default: '1'
                        description: The number of times a sensor captures the target. Single-look imagery will have more detail but also more noise. Multi-look imagery will be easier to understand but less detailed.
                        type: string
                      priority:
                        anyOf:
                        - const: standard
                          title: Standard
                        - const: high
                          title: High
                        title: Priority
                        default: standard
                        description: The urgency of the order. High-priority orders are completed faster, but cost more.
                        type: string
                    required:
                    - geometry
                    - displayName
                    - acquisitionStart
                    - acquisitionEnd
                    - acquisitionMode
                    - maxIncidenceAngle
                    - polarization
                    - priority
                    - looks
                    additionalProperties: false
                Catalog:
                  value:
                    additionalProperties: false
                    properties:
                      id:
                        title: Id
                        type: string
                      aoi:
                        description: Polygon Model.
                        properties:
                          type:
                            const: Polygon
                            default: Polygon
                            title: Type
                            type: string
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            type: array
                        required:
                        - coordinates
                        title: Polygon
                        type: object
                      displayName:
                        title: Order name
                        type: string
                    required:
                    - id
                    - aoi
                    title: ParamsWithAOI
                    type: object
                    $schema: https://json-schema.org/draft-07/schema
        '400':
          description: Not valid data product ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.up42.com/problems/not-valid-uuid
                title: Not a valid UUID
                status: 400
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                Schema not found:
                  value:
                    type: https://docs.up42.com/problems/schema-not-found
                    title: Schema not found
                    status: 404
                Data product not found:
                  value:
                    type: https://docs.up42.com/problems/data-product-not-found
                    title: Data product not found
                    status: 404
      security:
      - httpBearer: []
  /v2/orders:
    get:
      tags:
      - Orders
      summary: Get orders
      description: Get a list of tasking and catalog orders.
      operationId: listOrdersV2
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdQuery'
      - $ref: '#/components/parameters/OrderType'
      - $ref: '#/components/parameters/OrderV2Status'
      - $ref: '#/components/parameters/OrderSubStatusQuery'
      - $ref: '#/components/parameters/OrderDisplayNameQuery'
      - $ref: '#/components/parameters/DataProductIdsQuery'
      - $ref: '#/components/parameters/OrderIdsQuery'
      - $ref: '#/components/parameters/BudgetIdsQuery'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/PageablePage'
      - $ref: '#/components/parameters/PageableSize'
      - $ref: '#/components/parameters/PageableSorting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersV2PageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
      security:
      - httpBearer: []
    post:
      tags:
      - Orders
      summary: Create an order
      description: Create a new tasking or catalog order.
      operationId: createV2OrderUnderWorkspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdQueryRequired'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateV2OrderRequest'
        required: true
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateV2OrderResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              examples:
                badOrderRequest:
                  summary: Order request not valid
                  value:
                    type: https://docs.up42.com/problems/bad-order-request
                    status: 400
                    title: Order request not valid
                    detail: One or more query parameter values are not valid.
                    instance: /v2/orders
                    errors:
                    - name: featureCollection
                      reason: The feature list must not be empty.
                budgetIdRequired:
                  $ref: '#/components/examples/BudgetIdRequired'
                budgetIsNotActive:
                  $ref: '#/components/examples/BudgetIsNotActive'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              examples:
                budgetNotFound:
                  $ref: '#/components/examples/BudgetNotFoundOnOrder'
                accountNotEnterprise:
                  $ref: '#/components/examples/AccountNotEnterpriseOnOrder'
  /v2/orders/estimate:
    post:
      tags:
      - Orders
      summary: Estimate the cost of an order
      description: 'Get a cost estimation before creating a tasking or a catalog order.


        You can receive an overview of the overall credit amount that will be deducted from your credit balance if you decide to proceed with the ordering.'
      operationId: estimateV2Order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateV2OrderRequest'
        required: true
      responses:
        '200':
          description: 'Cost estimation returned. Any geometry validation failures will be returned inside the `errors` array

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateV2OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
  /v2/orders/validation:
    post:
      tags:
      - Orders
      summary: Validate input for an order
      description: Validate input for a tasking or catalog order before creating it.
      operationId: validateV2Order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateV2OrderRequest'
        required: true
      responses:
        '200':
          description: 'Order validation results

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderValidationBatchResponse'
              examples:
                validationAvailable:
                  summary: Validation completed
                  value:
                    Pléiades Neo over North America 1:
                      status: INVALID
                      errors:
                      - errorReason: The geometry area of 10 km² is below the minimum required size of 25 km².
                    Pléiades Neo over North America 2:
                      status: VALID
                validationUnavailable:
                  summary: Validation can't be completed
                  value:
                    Pléiades Neo over North America 1:
                      status: UNAVAILABLE
                      unavailabilityReason: Service unavailable, try again later
                    Pléiades Neo over North America 2:
                      status: UNAVAILABLE
                      unavailabilityReason: Service unavailable, try again later
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          $ref: '#/components/responses/DataProductNotFound'
      security:
      - httpBearer: []
  /v2/orders/{order-id}:
    get:
      tags:
      - Orders
      summary: Get an order
      description: Get information about a specific order.
      operationId: getOrderV2
      parameters:
      - $ref: '#/components/parameters/OrderIdPathKebab'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderV2Response'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
    patch:
      tags:
      - Orders
      summary: Update an order
      description: Change details of an existing tasking or catalog order.
      operationId: patchOrder
      parameters:
      - $ref: '#/components/parameters/OrderIdPathKebab'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/OrderPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderV2Response'
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
  /v2/orders/{order-id}/cancellation:
    post:
      tags:
      - Orders
      summary: Cancel an order
      description: Cancel an order currently in the `CREATED` or `PLACEMENT_FAILED` status. Once canceled, the order moves to the `CANCELED` status.
      operationId: cancelOrder
      parameters:
      - $ref: '#/components/parameters/OrderIdPathKebab'
      responses:
        '200':
          description: Order canceled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          description: Order can't be canceled in its current status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderingProblem'
              example:
                type: https://docs.up42.com/problems/order-cant-be-canceled
                status: 400
                title: Order can't be canceled
                detail: The order with the ID '68567134-27ad-7bd7-4b65-d61adb11fc78' can't be canceled in its current status.
                instance: /v2/orders/68567134-27ad-7bd7-4b65-d61adb11fc78/cancellation
                errors:
                - name: status
                  reason: You can cancel an order only if its status is 'CREATED' or 'PLACEMENT_FAILED'.
        '401':
          $ref: '#/components/responses/OrderingUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - httpBearer: []
components:
  schemas:
    PageableResponse:
      type: object
      properties:
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
          example: false
        totalElements:
          type: integer
          format: int64
          example: 100
        totalPages:
          type: integer
          format: int32
          example: 20
        size:
          type: integer
          format: int32
          example: 10
        number:
          type: integer
          format: int32
          example: 0
        sort:
          $ref: '#/components/schemas/Sort'
        numberOfElements:
          type: integer
          format: int32
          example: 10
        first:
          type: boolean
          example: true
        empty:
          type: boolean
          example: false
    PageableObject:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
          example: 0
        pageSize:
          type: integer
          format: int32
          example: 10
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
    OrderPatchRequest:
      type: object
      properties:
        tags:
          maxItems: 30
          type: array
          description: 'A list of tags to replace tags already assigned to the order. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`).

            '
          items:
            $ref: '#/components/schemas/Tag'
        budgetId:
          type:
          - string
          - 'null'
          description: 'The ID of the budget selected for this order. Set to `null` to remove the assigned budget. Once [consumption has been recorded](https://docs.up42.com/developers/api-budgets#consumption-events), this value can no longer be updated.

            '
          format: uuid
          example: c3de9ed8-f6e5-4bb5-a157-f6430ba756da
    ErrorResponseV1:
      required:
      - error
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
        error:
          $ref: '#/components/schemas/ErrorResponseObject'
      description: Legacy error wrapper used for authentication failures and some data-adapter schema errors.
    Problem:
      required:
      - status
      - title
      - type
      type: object
      properties:
        type:
          type: string
          description: 'A URI reference that uniquely identifies the problem type.

            '
          format: uri-reference
        status:
          type: integer
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
        title:
          type: string
          description: 'A short summary of the problem type.

            '
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem

            '
      description: RFC 9457 problem details for HTTP APIs
    EstimateV2OrderResponse:
      required:
      - errors
      - results
      - summary
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/EstimationV2Summary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/EstimationV2Result'
        errors:
          type: array
          description: 'Errors associated with individual geometries, including validation failures due to AOI size or vertex-count limits.

            '
          example: []
          items:
            $ref: '#/components/schemas/BatchEndpointErrorDetail'
      description: 'The cost estimation.

        '
    ArchiveOrderDetailsV2:
      type: object
      description: 'Catalog order details.

        '
      allOf:
      - $ref: '#/components/schemas/ArchiveOrderDetailsSharedProperties'
    TaskingOrderDetailsV2:
      type: object
      description: 'Tasking order details.

        '
      allOf:
      - $ref: '#/components/schemas/TaskingOrderDetailsSharedProperties'
    AcquisitionEnd:
      type: string
      description: 'The date and time when the sensor finished the acquisition process.

        '
      format: date-time
      example: '2024-06-30T00:00:00Z'
    OrderingFeature:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'The type of geometry. The only allowed value is `Feature`.

            '
          enum:
          - Feature
        geometry:
          $ref: '#/components/schemas/OrderingGeometry'
        properties:
          type: object
      description: 'A spatially bounded GeoJSON feature.

        '
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.2
    DataProductId:
      type:
      - string
      - 'null'
      description: The data product ID.
      format: uuid
      example: bcc3d9a3-a632-19c2-c1e1-f762cc3c7a12
    AccountId:
      type: string
      description: The account ID.
      format: uuid
      example: 55434287-31bc-3ad7-1a63-d61aac11ac55
    OrderSubStatus:
      type:
      - string
      - 'null'
      description: 'An [additional status](https://docs.up42.com/developers/api-tasking#order-substatuses) for the tasking order.

        '
      enum:
      - FEASIBILITY_WAITING_UPLOAD
      - FEASIBILITY_WAITING_RESPONSE
      - QUOTATION_WAITING_UPLOAD
      - QUOTATION_WAITING_RESPONSE
      - QUOTATION_ACCEPTED
      - QUOTATION_REJECTED
      - null
    OrderingProblem:
      required:
      - status
      - title
      - type
      type: object
      properties:
        type:
          type: string
          description: 'A URI reference that uniquely identifies the problem type.

            '
          format: uri-reference
        status:
          type: integer
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
        title:
          type: string
          description: 'A short summary of the problem type.

            '
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem.

            '
        instance:
          type:
          - string
          - 'null'
          description: 'A URI reference that identifies the specific occurrence of the problem.

            '
          format: uri-reference
        errors:
          type:
          - array
          - 'null'
          description: Validation errors for specific parameters.
          items:
            $ref: '#/components/schemas/InvalidParam'
      description: RFC 9457 Problem Details for HTTP APIs
    CreateV2OrderErrorDetails:
      required:
      - details
      - index
      - message
      type: object
      properties:
        index:
          type: number
          description: 'The failed order index number.

            '
        message:
          type: string
          description: The error message associated with the failed order.
        details:
          type: string
          description: Error message details.
    WorkspaceId:
      type: string
      description: The workspace ID.
      format: uuid
    OrderType:
      type: string
      description: The order type.
      enum:
      - TASKING
      - ARCHIVE
    ArchiveOrderDetailsSharedProperties:
      required:
      - aoi
      type: object
      properties:
        aoi:
          $ref: '#/components/schemas/OrderingGeometry'
        imageId:
          type: string
          description: 'The ID of the image scene.

            '
          format: uuid
          example: 68567134-27ad-7bd7-4b65-d61adb11fc78
    Sort:
      type: object
      properties:
        empty:
          type: boolean
          example: false
        sorted:
          type: boolean
          example: true
        unsorted:
          type: boolean
          example: false
    CreateV2OrderResponse:
      required:
      - errors
      - results
      type: object
      properties:
        results:
          type: array
          description: 'Details of the created orders. If you have defined multiple geometries, each geometry will result in a separate order.

            '
          items:
            $ref: '#/components/schemas/V2ResultDetails'
        errors:
          type: array
          description: 'Failed geometries error details.

            '
          items:
            $ref: '#/components/schemas/CreateV2OrderErrorDetails'
      description: 'The created orders data.

        '
    OrdersV2PageResponse:
      type: object
      properties:
        content:
          type: array
          description: A list of orders.
          items:
            $ref: '#/components/schemas/OrderV2Response'
      description: Order page
      allOf:
      - $ref: '#/components/schemas/PageableResponse'
    AcquisitionStart:
      type: string
      description: 'The date and time when the sensor started the acquisition process.

        '
      format: date-time
      example: '2024-05-23T00:00:00Z'
    EstimateV2OrderPricingUnit:
      type:
      - string
      - 'null'
      description: 'The unit of measurement used to calculate the size.

        '
      enum:
      - SQ_KM
      - SCENE
      - null
    CreateV2OrderRequest:
      required:
      - dataProduct
      - displayName
      - featureCollection
      - params
      type: object
      properties:
        dataProduct:
          type: string
          description: The data product ID.
          format: uuid
          example: 07c33a51-94b9-4509-84df-e9c13ea92b84
        displayName:
          $ref: '#/components/schemas/OrderDisplayName'
        tags:
          $ref: '#/components/schemas/Tags'
        budgetId:
          type:
          - string
          - 'null'
          description: 'The ID of the budget selected for this order. Credit consumption is recorded when the order reaches a [consumption event](https://docs.up42.com/developers/api-budgets#consumption-events) associated with a specific status.

            '
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        params:
          type: object
          additionalProperties: true
          description: 'Order parameters, excluding spatial geometry handled in the `featureCollection` object.

            '
          example:
            spectralBands: bundle
            radiometricProcessing: reflectance
            geometricProcessing: orthorectified
            pixelCoding: 16bit
            priority: high
            maxIncidenceAngle: 20
            maxCloudCover: 20
            projection: '4326'
            acquisitionMode: mono
            acquisitionStart: '2025-11-20T00:00:00.000Z'
            acquisitionEnd: '2025-11-27T00:00:00.000Z'
        featureCollection:
          $ref: '#/components/schemas/OrderingFeatureCollection'
    Tags:
      maxItems: 30
      type: array
      description: 'A list of tags that categorize the order. A tag can consist of letters, numbers, spaces, and special characters (`.`, `-`, `_`, `/`, `:`).

        '
      items:
        $ref: '#/components/schemas/Tag'
    OrderingGeometry:
      required:
      - coordinates
      - type
      type: object
      properties:
        type:
          type: string
          description: The type of geometry.
          example: Polygon
          enum:
          - Polygon
          - Point
        coordinates:
          description: The coordinates.
          example:
          - - - 77.259584
              - 28.622331
            - - 77.287879
              - 28.622632
            - - 77.287621
              - 28.594794
            - - 77.259389
              - 28.594983
            - - 77.259584
              - 28.622331
          oneOf:
          - type: array
            items:
              type: array
              items:
                minItems: 2
                type: array
                items:
                  type: number
                  format: double
          - type: array
            items:
              type: number
              format: double
        crs:
          type: object
          properties:
            type:
              type: string
              description: The parameter defining the CRS.
              example: name
            properties:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the CRS.
                  example: EPSG:4326
          description: The CRS of the order.
      description: 'The geometry in the GeoJSON format.

        '
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
    OrderValidationResponseDto:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: 'The [validation status](https://docs.up42.com/developers/api-tasking#validation-statuses).

            '
          enum:
          - VALID
          - INVALID
          - UNAVAILABLE
        errors:
          type: array
